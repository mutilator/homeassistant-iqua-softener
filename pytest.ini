[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    # Home Assistant 2026.11+ aliases httpx to httpx2 on import and fails if
    # httpx is already loaded. The respx plugin imports httpx before the
    # Home Assistant plugin loads, so disable it (as HA core does).
    -p no:respx
    --strict-markers
    --strict-config
    --verbose
    --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests